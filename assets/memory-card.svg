  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.3429;1" values="1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">Palmcast</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Hand the room the mic: talks, polls and Q&amp;A from phones.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.3429;0.4;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">keystones</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Pin a review gate to an AST node, not a file path.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.4;0.4571;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">vscode-cc-agent-manager</text><text x="44" y="314" font-size="13" fill="#e8f1ff">A live dashboard for Claude Code sessions in VSCode.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.4571;0.5143;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">yamlsettings</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Layered YAML settings with env var overrides.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.5143;0.5714;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">AmberDAV</text><text x="44" y="314" font-size="13" fill="#e8f1ff">One-binary WebDAV file server for handhelds and Steam Deck.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.5714;0.6286;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">SimpleConfidenceMonitor</text><text x="44" y="314" font-size="13" fill="#e8f1ff">A stage display for speakers, run from a phone.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.6286;0.6857;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">cc-cmux-plugin</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Claude Code agent status and alerts inside cmux.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.6857;0.7429;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">restraint-py</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Composable rate limiting, sync or async.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.7429;0.8;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">pre-commit-hooks</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Hooks incl. a Simplified Technical English linter.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.8;0.8571;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">pr-changes-matrix-builder</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Build a CI matrix from the files a PR touched.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.8571;0.9143;1" values="0;1;0;0" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">yaml-params</text><text x="44" y="314" font-size="13" fill="#e8f1ff">Export YAML into GitHub Actions env vars.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" keyTimes="0;0.9143;1" values="0;1;1" begin="0s;hit.click" dur="14.0s" fill="freeze"/><text x="44" y="290" font-size="16" fill="#f6c21c">renogy_rover</text><text x="44" y="314" font-size="13" fill="#e8f1ff">MODBUS driver for Renogy Rover solar controllers.</text></g>

